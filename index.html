<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06110e">
  <title>Quiz Bitcoin · Vinteum</title>
  <meta name="description" content="Quiz sobre Bitcoin da Vinteum. Acerte e ganhe um brinde!">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <div class="app">
    <header class="top">
      <a class="brand" href="https://vinteum.org" target="_blank" rel="noopener" aria-label="Vinteum">
        <img src="assets/icon.svg" alt="" width="34" height="31">
        <span class="wordmark">vinteum</span>
      </a>
      <span class="chip" id="event-name"></span>
    </header>

    <main>
      <!-- INÍCIO -->
      <section id="screen-start" class="screen">
        <p class="eyebrow">Quiz Bitcoin</p>
        <h1>Quanto você sabe sobre <span class="grad">Bitcoin?</span></h1>
        <p class="lead">Escolha a dificuldade, acerte a pergunta e leve um brinde da Vinteum.</p>
        <button class="btn primary big" id="btn-play">Jogar</button>
        <div class="follow-card"><div id="follow-start"></div></div>
      </section>

      <!-- DIFICULDADE -->
      <section id="screen-level" class="screen" hidden>
        <button class="back" id="btn-back-start" aria-label="Voltar">← Voltar</button>
        <h2>Escolha a dificuldade</h2>
        <div class="levels" id="levels"></div>
      </section>

      <!-- PERGUNTAS -->
      <section id="screen-quiz" class="screen" hidden>
        <div class="quiz-head">
          <span class="level-pill" id="q-level"></span>
          <span class="count" id="q-count"></span>
        </div>
        <div class="progress" id="q-progress" aria-hidden="true"></div>
        <h2 class="question" id="q-text" tabindex="-1"></h2>
        <div class="options" id="q-options"></div>
        <div class="feedback" id="q-feedback" aria-live="polite" hidden>
          <p class="verdict" id="q-verdict"></p>
          <p class="why" id="q-why"></p>
          <button class="btn primary" id="btn-next">Próxima</button>
        </div>
      </section>

      <!-- RESULTADO -->
      <section id="screen-result" class="screen" hidden>
        <div class="ring" id="r-ring"><span id="r-score"></span></div>
        <h2 id="r-title"></h2>
        <p class="lead" id="r-sub"></p>

        <div class="voucher" id="r-voucher" hidden>
          <p class="voucher-label">Seu brinde</p>
          <p class="voucher-prize" id="r-prize"></p>
          <p class="voucher-bonus" id="r-bonus" hidden></p>
          <p class="voucher-time" id="r-time"></p>
          <p class="voucher-note">Mostre esta tela para a equipe da Vinteum no stand.</p>
        </div>

        <div class="follow-card" id="r-follow" hidden><div id="follow-result"></div></div>

        <div class="actions">
          <button class="btn primary" id="btn-retry" hidden>Tentar novamente</button>
          <button class="btn ghost" id="btn-pen" hidden>Ficar com a caneta</button>
          <button class="btn primary" id="btn-home" hidden>Voltar ao início</button>
        </div>
      </section>
    </main>

    <footer class="foot">
      <a href="https://vinteum.org" target="_blank" rel="noopener">vinteum.org</a>
      <span>·</span>
      <a href="https://casa21.vinteum.org" target="_blank" rel="noopener">casa21.vinteum.org</a>
    </footer>
  </div>

  <script src="vendor/qrcode.js"></script>
  <script src="shared.js"></script>
  <script src="config.js"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
